{% extends "base.html" %}
{% block title %}College Register — EventLink{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
  <div class="w-full max-w-sm animate-slide-up">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">🏫</div>
      <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Register College</h2>
      <p class="text-gray-400 mt-1 text-sm">Create an account to host events</p>
    </div>

    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-2xl shadow-xl border border-gray-200/60 dark:border-gray-700/60 p-8">
      <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">College Name</label>
            <input type="text" name="college_name" required autofocus
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition placeholder-gray-400">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
            <input type="text" name="username" required
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition placeholder-gray-400">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
            <input type="email" name="email" required
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition placeholder-gray-400">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
            <input type="password" name="password1" required
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition placeholder-gray-400">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm Password</label>
            <input type="password" name="password2" required
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition placeholder-gray-400">
          </div>
          <button type="submit"
            class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold text-sm hover:bg-indigo-700 hover:scale-[1.02] transition duration-200 shadow-lg shadow-indigo-500/25 mt-2">
            Register College
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-5">
      Already registered?
      <a href="{% url 'college_login' %}" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
