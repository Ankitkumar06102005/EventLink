{% extends 'base.html' %}
{% block title %}Create Team — EventLink{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
  <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 right-1/3 w-80 h-80 rounded-full bg-indigo-400/10 dark:bg-indigo-500/5 blur-3xl"></div>
  </div>

  <div class="w-full max-w-sm animate-slide-up">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Create a Team</h2>
      <p class="text-gray-400 mt-1 text-sm">You'll be the leader — invite others after</p>
    </div>

    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-2xl shadow-xl border border-gray-200/60 dark:border-gray-700/60 p-8">
      <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Team Name</label>
            <input type="text" name="team_name" required autofocus placeholder="e.g. Byte Warriors"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition placeholder-gray-400">
          </div>
          <button type="submit"
            class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold text-sm hover:bg-indigo-700 hover:scale-[1.02] transition duration-200 shadow-lg shadow-indigo-500/25">
            Create Team
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-5">
      <a href="{% url 'dashboard' %}" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">← Back to Dashboard</a>
    </p>
  </div>
</div>
{% endblock %}
